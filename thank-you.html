<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Received | CreoCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230C1929'/><circle cx='50' cy='50' r='40' stroke='%23B58A46' stroke-width='4' fill='none'/><polygon points='50,12 45,20 55,20' fill='%23B58A46'/><polygon points='50,88 45,80 55,80' fill='%23B58A46'/><path d='M 18 50 L 44 50 L 50 28 L 56 50 L 82 50' stroke='%23B58A46' stroke-width='4' stroke-linejoin='round' fill='none'/><line x1='28' y1='58' x2='72' y2='58' stroke='%23FFFFFF' stroke-width='3'/><line x1='35' y1='64' x2='65' y2='64' stroke='%23FFFFFF' stroke-width='2.5'/><line x1='42' y1='70' x2='58' y2='70' stroke='%23FFFFFF' stroke-width='2'/></svg>">
    <style>
        :root {
            --navy: #0C1929;
            --gold: #B58A46;
            --gold-light: #C9A464;
            --cream: #F7F5F0;
            --white: #FFFFFF;
            --card-border: #E5E0D5;
            --text-dark: #1E252B;
            --text-muted: #5E6973;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--cream);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .thank-you-card {
            background: var(--white);
            max-width: 580px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(12, 25, 41, 0.08);
        }
        .mark { margin-bottom: 1.75rem; }
        h1 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            font-size: 2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }
        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--gold);
            color: var(--navy);
            padding: 0.85rem 2rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--gold-light);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <div class="mark">
            <svg width="64" height="64" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="42" stroke="#0C1929" stroke-width="4"/>
                <polygon points="50,2 45,10 55,10" fill="#B58A46"/>
                <polygon points="50,98 45,90 55,90" fill="#B58A46"/>
                <path d="M 12 50 L 44 50 L 50 26 L 56 50 L 88 50" stroke="#B58A46" stroke-width="3.5" stroke-linejoin="round"/>
                <line x1="26" y1="58" x2="74" y2="58" stroke="#0C1929" stroke-width="2.5"/>
                <line x1="33" y1="65" x2="67" y2="65" stroke="#0C1929" stroke-width="2.2"/>
            </svg>
        </div>
        <h1>Inquiry Received</h1>
        <p>Thank you for reaching out. We have logged your vessel details and project scope and will review them shortly.</p>
        <a href="/" class="btn">Return to CreoCraft</a>
    </div>
</body>
</html>
